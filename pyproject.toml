[project]
name = "toolbox"
version = "0.2.0"
description = "个人音视频处理工具箱"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # 脚本只依赖系统安装的 ffmpeg/ffprobe 二进制, 暂无第三方 Python 依赖。
    # 需要时可用: uv add <包名> 添加, 例如: uv add rich
]

[project.scripts]
# 安装后可用命令行直接调用: split-video 视频.mp4 / convert-audio 音频.m4a
split-video = "split_video:main"
convert-audio = "convert_audio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 把脚本作为独立模块打包
include = ["split_video.py", "convert_audio.py"]

[tool.uv]
package = true
